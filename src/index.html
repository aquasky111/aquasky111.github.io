<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Tree</title>
<meta name="description" content="Every page is a leaf. The tree grows as pages are added.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sun" aria-hidden="true"></div>
<div class="petals" aria-hidden="true"></div>
<header class="head">
  <h1>Spring Tree</h1>
  <p id="stage"><!--COUNT--> pages</p>
</header>
<main>
  <svg id="tree" role="group" aria-label="A tree where each leaf links to a page. Newest pages are at the top."></svg>
</main>
<div class="ground">
  <details class="all-pages" open>
    <summary>All pages, newest first</summary>
    <ul>
<!--LIST-->
    </ul>
  </details>
</div>
<div id="tip" role="tooltip" hidden></div>
<script src="tree-layout.js"></script>
<script src="tree.js"></script>
</body>
</html>
